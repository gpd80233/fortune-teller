<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日運勢抽籤器</title>
    <style>
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2d2b55);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 380px;
            width: 90%;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #ffd700;
        }

        p {
            color: #d1d1e0;
            font-size: 0.95rem;
            margin-top: 0;
        }

        .fortune-box {
            margin: 20px 0;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .fortune-img {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .result-title {
            font-size: 2rem;
            font-weight: bold;
            color: #ff79c6;
            margin: 5px 0 10px 0;
        }

        .result-desc {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #f8f8f2;
        }

        button {
            background: linear-gradient(45deg, #ff79c6, #bd93f9);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(189, 147, 249, 0.4);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(189, 147, 249, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(-10deg); }
            40% { transform: rotate(10deg); }
            60% { transform: rotate(-5deg); }
            80% { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    function drawFortune() {
        const box = document.getElementById('fortuneBox');
        const imgEl = document.getElementById('img');
        const fortuneEl = document.getElementById('fortune');
        const titleEl = document.getElementById('title');
        const descEl = document.getElementById('desc');

        box.classList.add('shake');

        titleEl.textContent = "⏳";
        descEl.textContent = "正在感應運勢...";

        setTimeout(() => {
            const randomIndex = Math.floor(Math.random() * fortunes.length);
            const result = fortunes[randomIndex];

            imgEl.src = result.image;
            fortuneEl.textContent = result.result;
            titleEl.textContent = result.title;
            descEl.textContent = result.content;

            box.classList.remove('shake');
        }, 500);
    }
